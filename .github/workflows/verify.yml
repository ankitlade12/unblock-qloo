name: Verify UNBLOCK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PATH: /tmp/unblock-ci.db
      APP_ORIGIN: http://127.0.0.1:8012
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8012
      QLOO_API_KEY: ""
      MODEL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start isolated server
        run: |
          python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8012 > /tmp/unblock-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8012/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/unblock-server.log
          exit 1
      - run: npm run test:e2e --prefix apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: apps/web/test-results/
