services:
  unblock:
    build: .
    ports:
      - "8011:8011"
    environment:
      PORT: "8011"
      COOKIE_SECURE: "false"
      APP_ORIGIN: http://localhost:8011
      QLOO_API_KEY: ${QLOO_API_KEY:-}
      QLOO_API_ORIGIN: ${QLOO_API_ORIGIN:-https://hackathon.api.qloo.com}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
    volumes:
      - unblock_data:/app/data
    restart: unless-stopped
volumes:
  unblock_data:
